name: dotnet-ci

on:
  push:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FuelIntegrationHub.slnx

      - name: Format check
        run: dotnet format FuelIntegrationHub.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FuelIntegrationHub.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test FuelIntegrationHub.slnx
          -c Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            dotnet/TestResults/
          if-no-files-found: ignore

      - name: Vulnerability audit
        run: dotnet list FuelIntegrationHub.slnx package --vulnerable --include-transitive

      - name: Publish API
        run: >
          dotnet publish src/FuelIntegrationHub.Api/FuelIntegrationHub.Api.csproj
          -c Release
          --no-build
          -o publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuel-integration-hub-api
          path: dotnet/publish/
          if-no-files-found: error
