# cargo-deny policy for the Shado workspace (docs/15 §4 security gate)
# Licenses observed across the pinned dependency set (serde/tokio/sqlx/ort/...).

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste (proc-macro, codegen-only) is unmaintained (RUSTSEC-2024-0436);
    # pulled via nalgebra → simba for the 8-dim Kalman state. No runtime
    # impact; revisit if nalgebra drops simba.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained codegen-only proc-macro via nalgebra/simba" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
