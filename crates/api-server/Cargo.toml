[package]
name = "api-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "shado-engine"
path = "src/main.rs"

[features]
default = []
# Tests that need `DATABASE_URL` (CI integration job provides the service).
itest = []

[dependencies]
common-types = { path = "../common-types", version = "0.1.0" }
rl-controller = { path = "../rl-controller", version = "0.1.0" }
vlm-orchestrator = { path = "../vlm-orchestrator", version = "0.1.0" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
